<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14212c"/>
      <stop offset="100%" stop-color="#0b1218"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Base Plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#1de9b6" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Subtle Graph in Background -->
  <path d="M 20 85 Q 35 83 45 70 T 70 78 T 90 55 T 108 62" fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Thermometer Bulb & Tube -->
  <path d="M 52 32 A 8 8 0 0 1 68 32 L 68 64.2 A 16 16 0 1 1 52 64.2 Z" fill="#0f1922" stroke="#48a999" stroke-width="3"/>
  <circle cx="60" cy="74" r="10" fill="url(#glow)"/>
  <rect x="57" y="42" width="6" height="26" rx="3" fill="url(#glow)"/>

  <!-- Tick Marks -->
  <line x1="72" y1="36" x2="78" y2="36" stroke="#48a999" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="46" x2="78" y2="46" stroke="#48a999" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="56" x2="78" y2="56" stroke="#48a999" stroke-width="2" stroke-linecap="round"/>
</svg>
