[package]
name = "cosmic-ext-temptyle"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Native COSMIC desktop applet hardware temperature and system monitor"
repository = "https://github.com/Kai-J-G/COSMIC---Hardware-Monitor-applet"

[dependencies]
# Persisted settings are (de)serialised by cosmic-config.
serde = { version = "1", features = ["derive"] }
# statvfs(3), for partition sizes.
libc = "0.2"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
