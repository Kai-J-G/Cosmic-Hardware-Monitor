[package]
name = "cosmic-ext-hardware-monitor"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Native hardware and thermal monitor applet for the COSMIC™ desktop"
repository = "https://github.com/Kai-J-G/CosmicHardwareMonitor"

[dependencies]
# Persisted settings are (de)serialised by cosmic-config.
serde = { version = "1", features = ["derive"] }
# statvfs(3), for partition sizes.
libc = "0.2"
# Localization. Fluent files under i18n/ are embedded into the binary, and
# `fl!()` checks every message id against them at compile time.
i18n-embed-fl = "0.10"
rust-embed = "8"

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
